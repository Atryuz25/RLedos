[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_edos"
version = "0.1.0"
description = "Adversarial RL testbed for Economic Denial of Sustainability (EDoS)-hardened cloud autoscaling"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "torch==2.3.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "pyyaml==6.0.1",
    "pyarrow==16.1.0",
    "pydantic==2.7.1",
    "tensorboard==2.16.2",
]

[project.optional-dependencies]
dev = ["black==24.4.2", "ruff==0.4.4", "pytest==8.2.0"]

[project.scripts]
rl-edos = "rl_edos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
