# Default experiment config. One consolidated file drives every run.
sim:
  control_interval_s: 30.0
  sim_horizon_steps: 120        # 1 hour episode at 30s intervals
  # EC2 instances commonly reach a healthy/running status within 30-90s of launch
  # (AWS EC2 instance status checks); not a fixed AWS default, so re-verify against
  # your AMI/instance type at build time. Configurable via ASG "Default Instance Warmup".
  instance_warmup_s: 60.0
  # AWS EC2 Auto Scaling's documented default cooldown period is 300 seconds:
  # https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple.html
  scale_cooldown_s: 300.0
  max_instances: 20
  min_instances: 1
  seed: 42
  capacity_rps_per_instance: 50.0
  base_latency_ms: 20.0
  max_queue_len: 1000.0         # bounded backlog; overflow drops rather than queueing forever

billing:
  # AWS EC2 t3.medium on-demand, us-east-1: $0.0416/hour -> /3600 per second.
  # https://aws.amazon.com/ec2/pricing/on-demand/ (re-verify at build time)
  price_per_instance_second: 0.00001156
  billing_granularity: per_second
  # 60-second minimum billing duration, per instance per interval:
  # https://aws.amazon.com/ec2/pricing/
  min_service_charge: 0.0006936   # price_per_instance_second * 60

traffic:
  legit_pattern: diurnal
  base_rate: 100.0
  diurnal_amplitude: 0.3
  noise_std: 5.0

attack:
  mode: scripted
  pattern: oscillation
  intensity: 1.5          # attack peak = 1.5x legit base_rate
  evasion_budget: 0.0

detection:
  type: rate_threshold
  window: 10
  threshold: 300.0
  penalty: 1.0

agent:
  algo: PPO
  reward_weights:
    cost_w: 1.0
    latency_w: 0.01
  total_timesteps: 10000
  policy_net: [64, 64]

baselines:
  target_utilization: 0.7   # target_tracking's utilisation setpoint

selfplay:
  rounds: 3
  round_timesteps: 5000
  convergence_tolerance: 0.05
  convergence_patience: 2
